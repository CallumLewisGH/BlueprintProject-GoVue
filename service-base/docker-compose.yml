services:  
  dev_db:
    container_name: app-db-dev
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${LOCAL_POSTGRES_PASSWORD:?set LOCAL_POSTGRES_PASSWORD in a local .env file}"
      POSTGRES_DB: app_db_dev
    ports:
      - 5432:5432
    volumes:
      - dev_db_data:/var/lib/postgresql/data

  prod_db:
    container_name: app-db-prod
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${LOCAL_POSTGRES_PASSWORD:?set LOCAL_POSTGRES_PASSWORD in a local .env file}"
      POSTGRES_DB: app_db_prod
    ports:
      - 5433:5432
    volumes:
      - prod_db_data:/var/lib/postgresql/data

  redis_db:
    container_name: app-redis-store
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # web:
  #   volumes:
  #     - web:usr/src/app

volumes:
  redis_data:
  dev_db_data:
  prod_db_data:
  #base:
  #web:
